<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charles Darwi</title>
    <style>
        header{
            background-color:#20065b;
            color: #FFFFFF;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;  
            padding: 18px;
            border: 3px solid #0e5b9e;
        }
        main{
          background-color:#FFFFFF;
            color: #20065b;

            display: block;

           }
        }

<body>
    <header>
        <h1>Charles Darwi</h1>
    <p>Naturalista e geólogo britânico</p>
    </header>

    <main>
        <img src="imagem-slide.png" alt="Charles Darwin, um homem idoso com uma longa barba branca,
         de perfil. À esquerda, uma árvore representa a Árvore da Vida, com várias espécies de tentilhões (pássaros) nos galhos, além de conchas e fósseis.
          Na mesa, há um livro aberto com um diagrama evolutivo e uma caixa de vidro com insetos colecionados. No canto inferior direito, 
          um pequeno globo terrestre mostra a rota de sua viagem. No topo está escrita a palavra "DARWIN" e, abaixo, "SELEÇÃO NATURAL EVOLUÇÃO".
        ">
    </main>
</body>
<script>
    const botao = document. querySelector("button");
    botao.addEventListener("click", botaoClicado);

    function botaoClicado(){
       console.log("fui clicado");
       let texto = botao.querySelector
       ("span");
       texto.textContent++;
    }
